name: Publish Node.js Release

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        description: "Node.js version to use"
        default: "24"
        required: false
      package_manager:
        type: string
        description: "Package manager used by the project: npm, yarn, or pnpm"
        default: "npm"
        required: false
      build_script:
        type: string
        description: "npm script name to run for building the project"
        default: "build"
        required: false
    secrets:
      NPM_TOKEN:
        description: "npm authentication token for publishing, leave blank if using Trusted Publishers"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.label.outputs.result }}
    steps:
      - name: Check for hra-release label on merged PR
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The commits/{sha}/pulls endpoint is eventually consistent: right
          # after a merge it can return an empty array for tens of seconds
          # before the commit gets associated with its PR. We retry ONLY while
          # the array is empty (the actual race). Once a PR is associated we
          # trust its labels and stop, so non-release merges never wait.
          attempts=5
          delay=30
          result="false"

          for i in $(seq 1 "$attempts"); do
            pulls=$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" 2>/dev/null || echo "[]")
            count=$(echo "$pulls" | jq 'length')

            if [ "$count" -gt 0 ]; then
              result=$(echo "$pulls" | jq -r 'any(.[].labels[].name; . == "hra-release")')
              echo "Found $count associated PR(s) on attempt $i/$attempts; is-release=$result"
              break
            fi

            echo "No PR associated with ${COMMIT_SHA} yet (attempt $i/$attempts)"
            if [ "$i" -lt "$attempts" ]; then
              echo "Retrying in ${delay}s to let the GitHub API catch up..."
              sleep "$delay"
            fi
          done

          echo "result=$result" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: holochain/actions/nodejs-setup@main
        with:
          node_version: ${{ inputs.node_version }}
          package_manager: ${{ inputs.package_manager }}
          cache: false # never use caching in release builds
          install_deps: true

      - uses: holochain/actions/nodejs-build@main
        with:
          package_manager: ${{ inputs.package_manager }}
          build_script: ${{ inputs.build_script }}

      - uses: holochain/actions/nodejs-publish@main
        with:
          npm_token: ${{ secrets.NPM_TOKEN }}
