name: Publish Node.js Release

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        description: "Node.js version to use"
        default: "24"
        required: false
      package_manager:
        type: string
        description: "Package manager used by the project: npm, yarn, or pnpm"
        default: "npm"
        required: false
      build_script:
        type: string
        description: "npm script name to run for building the project"
        default: "build"
        required: false
    secrets:
      NPM_TOKEN:
        description: "npm authentication token for publishing, leave blank if using Trusted Publishers"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.label.outputs.result }}
    steps:
      - name: Check for hra-release label on merged PR
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq 'any(.[].labels[].name; . == "hra-release")' 2>/dev/null || echo "false")
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./nodejs-setup
        with:
          node_version: ${{ inputs.node_version }}
          package_manager: ${{ inputs.package_manager }}
          cache: false # never use caching in release builds
          install_deps: true

      - uses: ./nodejs-build
        with:
          package_manager: ${{ inputs.package_manager }}
          build_script: ${{ inputs.build_script }}

      - uses: ./nodejs-publish
        with:
          npm_token: ${{ secrets.NPM_TOKEN }}
